# Builds pdfview-app for Linux and Windows and packs each into a zip with the
# libraries it needs (packaging/). A v* tag publishes them as a GitHub
# release; a manual run keeps them as workflow artifacts.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    # the oldest supported runner: the zip needs this glibc (2.39) or newer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14 ninja-build pkg-config patchelf zip \
            libpoppler-glib-dev libcairo2-dev libglfw3-dev libglm-dev nlohmann-json3-dev \
            libfreetype-dev libfontconfig-dev
      - name: Build
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake --version
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: packaging/bundle-linux.sh build "pdfview-${GITHUB_REF_NAME//\//-}-linux-x64" dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # keep LF line endings, as in the repository
      - run: git config --global core.autocrlf false
        shell: bash
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: zip
          pacboy: >-
            gcc:p cmake:p ninja:p pkgconf:p
            poppler:p poppler-data:p cairo:p glfw:p glm:p nlohmann-json:p freetype:p fontconfig:p
      - name: Build
        run: |
          cmake --version
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: packaging/bundle-windows.sh build "pdfview-${GITHUB_REF_NAME//\//-}-windows-x64" dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
